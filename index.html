<h1>Personaliza tu Paquete Turistico</h1>
        
        <form action="resultados.php" method="POST">
            
            
            <fieldset>
                <legend>Datos</legend>
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" required placeholder="Ej. Juan Perez Lopez">

                <label for="correo">Correo:</label>
                <input type="email" id="correo" name="correo" required placeholder="Ej. juan@correo.com">
            </fieldset>

           
            <fieldset>
                <legend>Destinos turisticos</legend>
                <label for="destinos">Selecciona uno o varios destinos:</label>
                <p class="nota">(Manten presionada la tecla Ctrl en Windows o Cmd en Mac para seleccionar varios)</p>
                <select name="destinos[]" id="destinos" multiple>
                    <option value="Cancun">Cancun</option>
                    <option value="Puerto Vallarta">Puerto Vallarta</option>
                    <option value="Acapulco">Acapulco</option>
                    <option value="Los Cabos">Los Cabos</option>
                    <option value="Mazatlan">Mazatlan</option>
                    <option value="Huatulco">Huatulco</option>
                    <option value="Puerto Escondido">Puerto Escondido</option>
                </select>
            </fieldset>

           
            <fieldset>
                <legend>Actividades turisticas</legend>
                <label><input type="checkbox" name="actividades[]" value="Buceo"> Buceo</label>
                <label><input type="checkbox" name="actividades[]" value="Paseo en lancha"> Paseo en lancha</label>
                <label><input type="checkbox" name="actividades[]" value="Visita a zonas arqueologicas"> Visita a zonas arqueologicas</label>
                <label><input type="checkbox" name="actividades[]" value="Senderismo"> Senderismo</label>
                <label><input type="checkbox" name="actividades[]" value="Pesca deportiva"> Pesca deportiva</label>
                <label><input type="checkbox" name="actividades[]" value="Recorrido gastronomico"> Recorrido gastronomico</label>
                <label><input type="checkbox" name="actividades[]" value="Visita a museos"> Visita a museos</label>
            </fieldset>

            
            <fieldset>
                <legend>Adicionales</legend>
                <label><input type="checkbox" name="servicios[]" value="Transporte al aeropuerto"> Transporte al aeropuerto</label>
                <label><input type="checkbox" name="servicios[]" value="Desayuno incluido"> Desayuno incluido</label>
                <label><input type="checkbox" name="servicios[]" value="Hospedaje de lujo"> Hospedaje de lujo</label>
                <label><input type="checkbox" name="servicios[]" value="Seguro de viajero"> Seguro de viajero</label>
                <label><input type="checkbox" name="servicios[]" value="Renta de automovil"> Renta de automovil</label>
                <label><input type="checkbox" name="servicios[]" value="Guia turistico"> Guia turistico</label>
            </fieldset>

            <button type="submit">Generar</button>
        </form>
    </div>
</body>
</html>
